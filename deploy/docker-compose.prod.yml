# =============================================================================
# ORBITAL-GHG — produção em VPS (docker compose -f deploy/docker-compose.prod.yml)
# HTTPS automático via Caddy (Let's Encrypt). Preencha deploy/.env antes.
# =============================================================================
name: orbital-ghg-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbital}
      POSTGRES_USER: ${POSTGRES_USER:-orbital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ../infra/db/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbital} -d ${POSTGRES_DB:-orbital}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
    volumes:
      - miniodata:/data

  api:
    build: ../apps/api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment: &api-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbital}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-orbital}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET forte em deploy/.env}
      CORS_ORIGINS: '["https://${APP_DOMAIN}"]'
      APP_NAME: ${APP_NAME:-ORBITAL-GHG}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CARBON_MAPPER_API_KEY: ${CARBON_MAPPER_API_KEY:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_SERVICE_ACCOUNT_KEY_FILE: ${GEE_SERVICE_ACCOUNT_KEY_FILE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  # jobs pesados (séries temporais, futuras inversões e PDFs em lote)
  worker:
    build: ../apps/api
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # agendador: verificação diária das watchlists (alertas)
  beat:
    build: ../apps/api
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment: *api-env
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-ORBITAL-GHG}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
